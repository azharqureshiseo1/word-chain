# Vercel only rebuilds when you push. This triggers a fresh Vercel build every day,
# so the new daily answer page and sitemap go live automatically.
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one for branch "main",
# then GitHub repo → Settings → Secrets and variables → Actions → New secret:
#   name: VERCEL_DEPLOY_HOOK   value: the hook URL
name: Daily Vercel rebuild
on:
  schedule:
    - cron: '10 8 * * *'   # 08:10 UTC = 00:10 US Pacific time
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
